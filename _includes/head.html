<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{%- assign page_title = page.title | default: site.title -%}
{%- if page.url == "/" -%}
  <title>{{ site.title }}</title>
{%- else -%}
  <title>{{ page_title }} · {{ site.title }}</title>
{%- endif %}

{%- assign page_description = page.description | default: site.description -%}
<meta name="description" content="{{ page_description | strip_newlines | strip }}">
<meta name="author" content="{{ site.author.name }}">

<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description | strip_newlines | strip }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
