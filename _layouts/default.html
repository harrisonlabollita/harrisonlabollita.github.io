<!doctype html>
<html lang="en">
<head>
  {%- include head.html -%}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="masthead">
    <a class="masthead__name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="masthead__nav" aria-label="Primary">
      {%- for item in site.nav %}
      <a href="{{ item.url | relative_url }}"
         {% if page.url contains item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
      <a href="{{ site.links.cv | relative_url }}">cv</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  {%- include footer.html -%}
</body>
</html>
