---
layout: default
---
<article class="page post">
  <h1 class="page__title">{{ page.title }}</h1>
  <p class="post__meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </p>
  {{ content }}

  <p class="post__back"><a href="{{ '/writing/' | relative_url }}">&larr; All writing</a></p>
</article>
